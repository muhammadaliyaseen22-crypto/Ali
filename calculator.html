<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammad Ali | Smart Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#18345b,#080d19 55%);color:#f5f7ff;font-family:Arial,sans-serif;display:flex;flex-direction:column}header{width:min(1100px,92%);margin:auto;padding:24px 0;display:flex;justify-content:space-between}.logo{font-size:23px;font-weight:bold;color:#79b2ff;text-decoration:none}.back{color:#c6d5ec;text-decoration:none}main{width:min(1000px,92%);margin:auto;display:grid;grid-template-columns:1fr 400px;gap:40px;align-items:center;padding:45px 0}.tag{color:#79b2ff;letter-spacing:2px;font-size:12px;font-weight:bold}h1{font-size:clamp(40px,7vw,66px);line-height:1.08}h1 span{color:#79b2ff}.intro{color:#aab7ce;line-height:1.7;max-width:470px}.calculator{background:#111a2b;border:1px solid #2a3c59;border-radius:22px;padding:18px;box-shadow:0 20px 65px #0008}.display{background:#091221;border-radius:13px;padding:18px;min-height:105px;display:flex;flex-direction:column;justify-content:end;align-items:end;margin-bottom:13px;overflow:hidden}.previous{color:#9eabc2;font-size:14px;min-height:20px}.current{font-size:40px;overflow-wrap:anywhere}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}button{border:0;border-radius:12px;min-height:59px;background:#17243a;color:white;font-size:20px;font-weight:bold;cursor:pointer}button:hover{filter:brightness(1.25)}.op{background:#1c3557;color:#9bc6ff}.util{background:#263247}.equal{background:#3985ed}.zero{grid-column:span 2}.hint{text-align:center;color:#9eabc2;font-size:12px}footer{text-align:center;padding:22px;color:#8190a9;border-top:1px solid #1b2940;font-size:13px}@media(max-width:760px){main{grid-template-columns:1fr;gap:25px}.copy{text-align:center}.intro{margin:auto}.calculator{width:min(100%,420px);margin:auto}}
</style>
</head>
<body>
<header><a class="logo" href="index.html">MA.</a><a class="back" href="index.html">← Back to portfolio</a></header>
<main>
<section class="copy"><div class="tag">PORTFOLIO PROJECT · 01</div><h1>Smart<br><span>Calculator.</span></h1><p class="intro">A clean, responsive calculator built with HTML, CSS and JavaScript. Use the buttons or your keyboard for everyday calculations.</p></section>
<section class="calculator" aria-label="Calculator">
<div class="display"><div class="previous" id="previous"></div><div class="current" id="current">0</div></div>
<div class="keys">
<button class="util" data-action="clear">AC</button><button class="util" data-action="delete">DEL</button><button class="util" data-action="percent">%</button><button class="op" data-op="÷">÷</button>
<button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button><button class="op" data-op="×">×</button>
<button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button><button class="op" data-op="−">−</button>
<button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button><button class="op" data-op="+">+</button>
<button class="zero" data-num="0">0</button><button data-num=".">.</button><button class="equal" data-action="equals">=</button>
</div><p class="hint">Keyboard supported · Press Esc to clear</p>
</section>
</main>
<footer>© 2026 Muhammad Ali · Portfolio Project</footer>
<script>
let cur='0',prev='',op=null,reset=false;
const out=document.getElementById('current'),line=document.getElementById('previous');
function show(){out.textContent=cur;line.textContent=prev+(op?' '+op:'')}
function num(n){if(reset){cur='0';reset=false}if(n==='.'&&cur.includes('.'))return;if(cur==='0'&&n!=='.')cur=n;else cur+=n;show()}
function choose(o){if(op&&prev&&!reset)calc();prev=cur;op=o;reset=true;show()}
function calc(){if(!op||!prev)return;let a=Number(prev),b=Number(cur),r;if(op==='+')r=a+b;if(op==='−')r=a-b;if(op==='×')r=a*b;if(op==='÷')r=b===0?'Error':a/b;cur=typeof r==='number'?(Number.isFinite(r)?String(Number(r.toPrecision(12))):'Error'):r;prev='';op=null;reset=true;show()}
function clearAll(){cur='0';prev='';op=null;reset=false;show()}
function del(){if(reset){cur='0';reset=false}else cur=cur.length>1?cur.slice(0,-1):'0';show()}
function percent(){if(cur!=='Error')cur=String(Number(cur)/100);show()}
document.querySelector('.keys').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.num!==undefined)num(b.dataset.num);else if(b.dataset.op)choose(b.dataset.op);else if(b.dataset.action==='clear')clearAll();else if(b.dataset.action==='delete')del();else if(b.dataset.action==='percent')percent();else if(b.dataset.action==='equals')calc()});
document.addEventListener('keydown',e=>{if(/^[0-9.]$/.test(e.key))num(e.key);else if(e.key==='+')choose('+');else if(e.key==='-')choose('−');else if(e.key==='*')choose('×');else if(e.key==='/'){e.preventDefault();choose('÷')}else if(e.key==='Enter'||e.key==='=')calc();else if(e.key==='Backspace')del();else if(e.key==='Escape')clearAll();else if(e.key==='%')percent()});
</script>
</body></html>
